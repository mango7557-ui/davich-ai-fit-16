    <!-- Dynamic SEO and OpenGraph Synchronization for Company Link Sharing -->
    <script>
      (function() {
        try {
          var fullImgUrl = new URL('og-image.png', window.location.href).href;

          // Set absolute image URLs
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg) ogImg.setAttribute('content', fullImgUrl);
          var ogSecureImg = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogSecureImg) ogSecureImg.setAttribute('content', fullImgUrl);
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg) twImg.setAttribute('content', fullImgUrl);

          // Company parameter dynamic title & subtitle
          var params = new URLSearchParams(window.location.search);
          var companyCode = params.get('company');
          if (companyCode) {
            var compMap = {
              'store-gangnam': '다비치안경 강남점',
              'davich-hq': '다비치안경 본사',
              'store-daechi': '다비치안경 대치본점',
              'davich-sx7r': '다비치안경 명동점',
              'store-myeongdong': '다비치안경 명동점'
            };
            var cName = compMap[companyCode.toLowerCase()] || '다비치안경 전용 지점';
            var companyTitle = '[' + cName + '] 임직원 AI 역량 & 16 성향 진단 (DAVICH AI FIT 16)';
            var companyDesc = '16개 업무 성향 진단 및 현장 업무 자동화 설문 참여 (소요시간: 약 10~15분 · 수신 후 1주일 이내 완료)';

            document.title = companyTitle;

            var metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.setAttribute('content', companyDesc);

            var ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.setAttribute('content', companyTitle);

            var ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.setAttribute('content', companyDesc);

            var twTitle = document.querySelector('meta[name="twitter:title"]');
            if (twTitle) twTitle.setAttribute('content', companyTitle);

            var twDesc = document.querySelector('meta[name="twitter:description"]');
            if (twDesc) twDesc.setAttribute('content', companyDesc);
          }
        } catch (e) {
          console.warn('SEO dynamic initialization:', e);
        }
      })();
    </script>
